# Inverted bind mount for Canvas local development.
#
# With `no_project_mount: true` in config.yaml, DDEV does not bind-mount the
# project root at /var/www/html. Instead:
#   - a named Docker volume provides the Drupal scaffold (core, vendor,
#     index.php, other contrib) at /var/www/html, and
#   - this repository is bind-mounted directly at its natural module location,
#     /var/www/html/web/modules/contrib/canvas.
#
# This replaces ddev-drupal-contrib's `symlink-project`, which would otherwise
# symlink every project file individually into the docroot. Those symlinks made
# the module's files exist at two paths, breaking npm workspaces and producing
# an ambiguous xdebug path map. The bind mount gives a clean 1:1 host->container
# mapping (host repo root <-> /var/www/html/web/modules/contrib/canvas) and keeps
# node_modules at the same path it has always lived.
#
# The scaffold volume is Compose-managed (not `external`) so `ddev delete`
# removes it. `ddev cleanup` removes it explicitly as well.
services:
  web:
    volumes:
      # Drupal scaffold root. composer install (via `ddev poser`) writes core
      # and vendor here; nothing the module owns is stored in the volume.
      - type: volume
        source: drupal_scaffold
        target: /var/www/html
      # This repository, at its natural Drupal module location. No symlinks.
      - type: bind
        source: ../
        target: /var/www/html/web/modules/contrib/canvas
        consistency: cached

volumes:
  drupal_scaffold:

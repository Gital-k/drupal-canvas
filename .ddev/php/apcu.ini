[apcu]
; Raise APCu's shared-memory size for local development.
;
; A full Drupal + Canvas install with test-module discovery enabled fills the
; default 32 MB within minutes (~23k cache entries), forcing APCu to expunge —
; wipe and rebuild the cache — repeatedly. The status report surfaces this as
; "APCu is using over 90% of its allotted memory (32 MB)". 96 MB leaves ample
; headroom so expunges stay at zero and cache hits stay warm.
apc.shm_size = 96M

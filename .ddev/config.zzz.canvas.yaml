# Hook suppression for the Playwright add-on.
# Sorts last (zzz), after config.playwright.yml.
#
# config.playwright.yml is a #ddev-generated file we cannot edit. It injects
# hooks that are wrong for Canvas's layout:
#   - pre-start  `cp -r test/playwright .ddev/web-build/` (Canvas keeps
#     package.json at the repo root; there is no test/playwright dir)
#   - post-start `rm -rf .ddev/web-build/playwright` (cleanup of that copy)
#
# DDEV merges hook lists, so a normal config cannot remove an inherited hook.
# `override_config: true` makes this file's declared keys REPLACE the accumulated
# value instead of merging. It is granular to each leaf key, so declaring
# hooks.pre-start and hooks.post-start replaces only those two lists, leaving all
# other merged config (web_environment, ports, etc.) intact. This file must sort
# after config.playwright.yml for its override to win — hence the zzz prefix.
#
# The replacement lists below re-declare only the hooks Canvas actually needs:
#   pre-start  1. refresh Dockerfile.playwright from the disabled template (add-on)
#              2. stage package.json/package-lock.json for the Docker build (ours)
#   post-start    run `ddev setup` (builds core/vendor, symlinks the project,
#                 installs Drupal)
override_config: true
hooks:
  pre-start:
    - exec-host: |
        ([[ -f .ddev/web-build/Dockerfile.playwright ]] && \
          cp .ddev/web-build/disabled.Dockerfile.playwright .ddev/web-build/Dockerfile.playwright) || true
    - exec-host: |
        # The add-on expects test/playwright/ but Canvas keeps package.json at the project root.
        # Must copy (not symlink) because Docker bind mounts don't follow symlinks outside the mount.
        if [[ -f .ddev/web-build/Dockerfile.playwright ]]; then
          mkdir -p .ddev/web-build/playwright
          cp package.json package-lock.json .ddev/web-build/playwright/
        fi
  post-start:
    - exec-host: |
        ddev setup

'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: Video (oEmbed)
status: stable
group: Atom/Media
description: A video element using Youtube or Vimeo as providers
props:
  type: object
  required:
    - video
  properties:
    video:
      title: Video via oEmbed
      type: object
      $ref: json-schema-definitions://experience_builder.module/oembed_video
      description: The video object.
      examples:
        - url: https://www.youtube.com/oembed?url=https%3A//www.youtube.com/watch%3Fv%3DPWjcqE3QKBg
          title: Example oEmbed video title
    width:
      title: width
      type: integer
      examples:
        - 1280
    height:
      title: width
      type: integer
      examples:
        - 720

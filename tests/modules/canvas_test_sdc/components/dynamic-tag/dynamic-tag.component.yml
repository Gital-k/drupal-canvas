$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Canvas test SDC with a dynamic tag name
props:
  type: object
  required:
    - heading
    - tag
  properties:
    heading:
      type: string
      title: Heading
      description: The main heading of the hero
      minLength: 2
      examples:
        - There goes my hero
        - Submit now
    tag:
      type: string
      title: Tag
      description: The dynamic tag name wrapping the heading.
      examples:
        - h2
    attributes:
      type: Drupal\Core\Template\Attribute
      name: Attributes
      title: Attributes
slots:
  the_body:
    title: The Body
    description: The contents of the body.
    examples:
      - <p>Example value for <strong>the_body</strong> slot in <strong>dynamic-tag</strong> component.</p>

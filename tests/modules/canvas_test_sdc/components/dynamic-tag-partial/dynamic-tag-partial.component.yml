$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Canvas test SDC with a partially-dynamic tag name
props:
  type: object
  required:
    - heading
    - level
  properties:
    heading:
      type: string
      title: Heading
      description: The main heading of the hero
      minLength: 2
      examples:
        - There goes my hero
        - Submit now
    level:
      type: string
      title: Level
      description: >-
        The dynamic suffix of a `<h{{ level }}>` heading tag - the tag name
        is only partially dynamic (a literal "h" prefix immediately followed
        by the print), unlike a fully dynamic `<{{ tag }}>`.
      examples:
        - '1'
    attributes:
      type: Drupal\Core\Template\Attribute
      name: Attributes
      title: Attributes
slots:
  the_body:
    title: The Body
    description: The contents of the body.
    examples:
      - <p>Example value for <strong>the_body</strong> slot in <strong>dynamic-tag-partial</strong> component.</p>

$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Canvas test SDC with an "as" dynamic tag name (polymorphic element)
props:
  type: object
  required:
    - heading
    - as
  properties:
    heading:
      type: string
      title: Heading
      description: The main heading of the hero
      minLength: 2
      examples:
        - There goes my hero
        - Submit now
    as:
      type: string
      title: As
      description: >-
        The dynamic tag name wrapping the heading, immediately followed by
        {{ attributes }} with no intervening text - mirrors the common "as"
        prop convention for polymorphic elements (e.g.
        `<{{ as }}{{ attributes }}>`).
      examples:
        - h2
    attributes:
      type: Drupal\Core\Template\Attribute
      name: Attributes
      title: Attributes
slots:
  the_body:
    title: The Body
    description: The contents of the body.
    examples:
      - <p>Example value for <strong>the_body</strong> slot in <strong>dynamic-tag-as</strong> component.</p>

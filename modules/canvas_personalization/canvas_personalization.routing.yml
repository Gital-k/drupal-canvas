# ⚠️ This is highly experimental and *will* be refactored or even removed.
# @todo Revisit in https://www.drupal.org/i/3527086

# The internal HTTP API for Canvas' UI.
# Note these route names deliberately use the parent module's `canvas.api.`
# prefix: that is what makes Canvas treat them as part of its internal HTTP API
# — for OpenAPI validation, for JSON error responses and (for `canvas.api.form.`
# routes) for rendering forms in the `canvas_stark` theme.
# @see \Drupal\canvas\EventSubscriber\ApiMessageValidatorBase::isCanvasMessage()
# @see \Drupal\canvas\EventSubscriber\ApiExceptionSubscriber::onException()
# @see \Drupal\canvas\Theme\CanvasThemeNegotiator::applies()
canvas.api.personalization.segment_rule.list:
  path: '/canvas/api/v0/personalization/segment-rules'
  defaults:
    _controller: 'Drupal\canvas_personalization\Controller\ApiSegmentRuleControllers::list'
  requirements:
    _canvas_authentication_required: TRUE
    # Segmentation rules are only ever used to build a Segment, so this requires
    # the same permission as administering Segments rather than the broader
    # `_canvas_ui_access`: nobody else has a reason to learn which condition
    # plugins this site has installed.
    _permission: 'administer personalization segments'
  options:
    _format: 'json'
  methods: [GET]

entity.segment.collection:
  path: '/admin/structure/segment'
  defaults:
    _entity_list: 'segment'
    _title: 'Personalization Segment configuration'
  requirements:
    _permission: 'administer personalization segments'

entity.segment.add_form:
  path: '/admin/structure/segment/add'
  defaults:
    _entity_form: 'segment.add'
    _title: 'Add a personalization segment'
  requirements:
    _entity_create_access: 'segment'

entity.segment.edit_form:
  path: '/admin/structure/segment/{segment}'
  defaults:
    _entity_form: 'segment.edit'
    _title: 'Edit a personalization segment'
  requirements:
    _entity_access: 'segment.edit'

entity.segment.add_rule_form:
  path: '/admin/structure/segment/{segment}/rule'
  defaults:
    _entity_form: 'segment.add_rule_form'
    _title: 'Add a personalization segment rule'
  requirements:
    _entity_access: 'segment.edit'

entity.segment.delete_segment_rule:
  path: '/admin/structure/segment/{segment}/rule-delete/{rule}'
  defaults:
    _controller: '\Drupal\canvas_personalization\Controller\SegmentationRuleController::delete'
    _title: 'Delete a personalization segment rule'
  parameters:
    rule:
      type: string
  requirements:
    _entity_access: 'segment.edit'
    _csrf_token: 'TRUE'

entity.segment.delete_form:
  path: '/admin/structure/segment/{segment}/delete'
  defaults:
    _entity_form: 'segment.delete'
    _title: 'Delete a personalization segment'
  requirements:
    _entity_access: 'segment.delete'

canvas_dev_translation.api.content.translation.delete:
  path: '/canvas/api/v0/content/canvas_page/{canvas_page}/translations/{language}'
  defaults:
    _controller: 'Drupal\canvas\Controller\ApiContentTranslationControllers::delete'
  requirements:
    _canvas_authentication_required: TRUE
    _entity_access: 'canvas_page.delete'
  options:
    parameters:
      canvas_page:
        type: entity:canvas_page
      language:
        type: language
    _format: 'json'
  methods: [DELETE]

canvas_dev_translation.ui.content.translation.delete:
  path: '/admin/content/pages/{canvas_page}/translations/{language}/delete'
  defaults:
    _entity_form: 'canvas_page.content_translation_deletion'
    _title: 'Delete translation'
    entity_type_id: canvas_page
  requirements:
    _entity_access: 'canvas_page.delete'
  options:
    _admin_route: TRUE
    parameters:
      canvas_page:
        type: entity:canvas_page
      language:
        type: language

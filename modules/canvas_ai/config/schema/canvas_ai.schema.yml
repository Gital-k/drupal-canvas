canvas_ai.settings:
  type: config_object
  label: 'Drupal Canvas AI Settings'
  mapping:
    http_client_options:
      type: mapping
      label: 'HTTP Client Options'
      mapping:
        timeout:
          type: integer
          label: 'Timeout'
          description: 'HTTP request timeout in seconds'
    file_upload_size:
      type: integer
      label: 'Maximum image upload size (MB)'
      description: 'Maximum allowed image upload size in megabytes.'

canvas_ai.component_description.settings:
  type: config_object
  label: 'Canvas AI Component Description Settings'
  mapping:
    component_context:
      type: sequence
      label: 'Component Source'
      orderby: key
      sequence:
        type: mapping
        label: 'Source config'
        mapping:
          enabled:
            type: boolean
            label: 'Enabled'
            description: 'Enable or disable the components from this source.'
          data:
            type: text
            label: 'Data'
            description: 'YAML string containing the component data.'
            constraints:
              NotBlank: []

canvas_ai.theme_region.settings:
  type: config_object
  label: 'Canvas AI Theme Region Settings'
  mapping:
    region_descriptions:
      type: sequence
      label: 'Region descriptions'
      sequence:
        type: sequence
        label: 'Theme'
        sequence:
          type: mapping
          label: 'Region'
          mapping:
            name:
              type: label
              label: 'Region name'
            description:
              type: text
              label: 'Region description'


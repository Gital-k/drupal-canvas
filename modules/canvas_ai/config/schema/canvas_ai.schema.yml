canvas_ai.settings:
  type: config_object
  label: 'Drupal Canvas AI Settings'
  mapping:
    http_client_options:
      type: mapping
      label: 'HTTP Client Options'
      mapping:
        timeout:
          type: integer
          label: 'Timeout'
          description: 'HTTP request timeout in seconds'
    file_upload_size:
      type: integer
      label: 'Maximum image upload size (MB)'
      description: 'Maximum allowed image upload size in megabytes.'
    chat_history_max_messages:
      type: integer
      label: 'Maximum chat history messages'
      description: 'Maximum number of previous messages passed to the AI as conversation history. -1 means full history, 0 means no history.'
      constraints:
        Range:
          min: -1
    disable_real_time_page_generation:
      type: boolean
      label: 'Disable real-time page generation'
      description: 'When TRUE the AI plans the whole page and places it in a single request (batch) instead of building it section by section (the streaming default). Saves tokens and requests but the page appears all at once and is more prone to request timeouts.'

canvas_ai.component_description.settings:
  type: config_object
  label: 'Canvas AI Component Description Settings'
  mapping:
    component_context:
      type: sequence
      label: 'Component Source'
      orderby: key
      constraints:
        # Canvas AI agents only work with SDC, block, and JS component sources.
        SequenceKeysMatchRegex:
          pattern: '/^(sdc|js|block)$/'
          message: 'The %value key is not a supported component source plugin ID.'
      sequence:
        type: mapping
        label: 'Source config'
        mapping:
          enabled:
            type: boolean
            label: 'Enabled'
          data:
            type: text
            label: 'Data'
            description: 'YAML string containing the component data.'
            constraints:
              NotBlank: []

canvas_ai.theme_region.settings:
  type: config_object
  label: 'Canvas AI Theme Region Settings'
  mapping:
    region_descriptions:
      type: sequence
      label: 'Region descriptions'
      sequence:
        type: sequence
        label: 'Theme'
        sequence:
          type: mapping
          label: 'Region'
          mapping:
            name:
              type: label
              label: 'Region name'
            description:
              type: text
              label: 'Region description'

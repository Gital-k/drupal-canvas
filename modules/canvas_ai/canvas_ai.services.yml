services:
  _defaults:
    autoconfigure: true
    autowire: true
  cache.variation.canvas_ai:
    class: Drupal\Core\Cache\VariationCacheInterface
    factory: ['@variation_cache_factory', 'get']
    arguments: ['default']
  cache.canvas_ai_memory:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin.memory, default_backend: cache.backend.memory.memory }
    factory: ['@cache_factory', 'get']
    arguments: [canvas_ai_memory]
  cache.variation.canvas_ai_memory:
    class: Drupal\Core\Cache\VariationCacheInterface
    factory: ['@variation_cache_factory', 'get']
    arguments: ['canvas_ai_memory']
  canvas_ai.page_builder_helper:
    class: Drupal\canvas_ai\CanvasAiPageBuilderHelper
  canvas_ai.component_context_helper:
    class: Drupal\canvas_ai\CanvasAiComponentContextHelper
    arguments:
      - '@canvas_ai.page_builder_helper'
  canvas_ai.tempstore:
    class: Drupal\canvas_ai\CanvasAiTempStore
  canvas_ai.response_validator:
    class: Drupal\canvas_ai\AiResponseValidator
    arguments:
      - '@Drupal\Core\Validation\BasicRecursiveValidatorFactory'
      - '@uuid'
  canvas_ai.chat_helper:
    class: Drupal\canvas_ai\CanvasAiChatHelper
    arguments:
      - '@config.factory'
  Drupal\canvas_ai\CanvasAiTempStore: '@canvas_ai.tempstore'

  logger.channel.canvas_ai:
    parent: logger.channel_base
    arguments: ['canvas_ai']

  canvas_ai.component_schema_loader:
    class: Drupal\canvas_ai\Service\ComponentSchemaLoader
    arguments:
      - '@extension.list.theme'
      - '@theme_handler'
      - '@cache.default'
      - '@logger.channel.canvas_ai'
      - '@config.factory'

  canvas_ai.direct_edit_matcher:
    class: Drupal\canvas_ai\Service\DirectEditMatcher
    arguments:
      - '@canvas_ai.component_schema_loader'
      - '@config.factory'
